<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft Reports</title><link rel="stylesheet" href="/assets/editor.css"><link rel="stylesheet" href="/assets/pick-stats.css"><script src="/assets/pick-stats.js" defer></script></head><body>
<header><div><span class="kicker">CUBE</span><h1>Draft reports</h1></div><div class="header-actions"><a href="/editor.html">Editor</a><a href="/api/draft-export" title="Download all counts as CSV" aria-label="Download all counts as CSV"><img src="/assets/icons/download.svg" alt="" width="20" height="20"></a><button id="refresh" class="icon-button" title="Refresh reports" aria-label="Refresh reports"><img src="/assets/icons/refresh-cw.svg" alt=""></button></div></header>
<main class="stats-main"><p id="totals" role="status">Loading reports...</p><p class="caution">Counts, not pick rates. Small samples are noisy.</p>
<div class="filters"><label>Pack<select id="pack"><option value="">All packs</option><option>1</option><option>2</option><option>3</option></select></label><label>Experience<select id="experience"><option value="">All experience</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Cube version<select id="version"><option value="">All versions</option></select></label><label>Order<select id="order"><option value="last">Most last cards</option><option value="first">Most first picks</option><option value="name">Card name</option></select></label><label class="search-filter">Card<input id="search" type="search" placeholder="Card name"></label></div>
<p id="empty" hidden>No reports yet.</p><table><thead><tr><th>Card</th><th>First</th><th>Last</th></tr></thead><tbody id="rows"></tbody></table>
<footer><p>Voluntary, anonymous observations. No player identities or unique-player counts. Missing reports are unknown, not zero popularity.</p><a href="https://draft.coolasheck.com/?pick=last" target="_blank" rel="noreferrer">Player form</a></footer></main></body></html>
